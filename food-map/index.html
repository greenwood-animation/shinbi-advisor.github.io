<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>신비할망의 바당 맛 지도</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div id="app">

    <!-- ── 1단계: 메뉴 그리드 ─────────────────────────── -->
    <section id="screen-menu" class="screen is-active">
      <div class="menu-bg" aria-hidden="true">
        <img src="assets/background_room.png" alt="" onerror="this.style.display='none'" />
        <img src="assets/순덕_메인.png" alt="" onerror="this.style.display='none'" />
        <img src="assets/menu_back.png" alt="" onerror="this.style.display='none'" />
      </div>
      <div class="menu-hero-spacer"></div>
      <header class="menu-head">
        <img class="menu-title-img" src="assets/menu_title.png" alt="제주 바당 맛 지도" onerror="this.style.display='none'" />
      </header>
      <div class="menu-panel">
        <div class="menu-grid" id="menuGrid"></div>
      </div>
      <div class="menu-chatbar">
        <img class="menu-chat-img" src="assets/menu_chat.png" alt="순덕이에게 물어보기" />
      </div>
    </section>

    <!-- ── 2단계: 제주 지도 + 핀 + 추천 맛집 ────────────── -->
    <section id="screen-map" class="screen">
      <button class="back-btn" data-back="menu">
        <img src="assets/back_button.png" alt="← 메뉴로" onerror="this.style.display='none'" />
      </button>

      <div class="map-guide-spacer"></div>

      <div class="map-card">
        <img class="card-frame-img" src="assets/detail_window.png" alt="" onerror="this.style.display='none'" />
        <div class="map-card-inner">
          <div class="map-card-head">
            <h2 class="map-title"><span class="shell-ic" aria-hidden="true">🐚</span>제주 오름 맛집 지도</h2>
            <button class="more-btn" type="button">
              <img src="assets/detail_button.png" alt="지도 더보기 >" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'more-btn-fallback',textContent:'지도 더보기 >'}))" />
            </button>
          </div>
          <p class="map-sub">제주의 숨은 맛집을 찾아보세요!</p>
          <div class="map-wrap" id="mapWrap">
            <img class="map-bg" id="mapBg" src="assets/jeju-map.png" alt="제주 지도" />
            <div class="pins" id="pins"></div>
            <p class="map-empty" id="mapEmpty" hidden>아직 등록된 식당이 없어요 🐚</p>
          </div>
        </div>
      </div>

      <div class="recommend-card">
        <img class="card-frame-img" src="assets/detail_window_2.png" alt="" onerror="this.style.display='none'" />
        <div class="recommend-card-inner">
          <div class="map-card-head">
            <h2 class="map-title"><span class="shell-ic" aria-hidden="true">🐚</span>신비할망 추천 맛집</h2>
            <button class="more-btn" type="button">
              <img src="assets/detail_button.png" alt="더보기 >" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'more-btn-fallback',textContent:'더보기 >'}))" />
            </button>
          </div>
          <div class="recommend-list" id="recommendList"></div>
        </div>
      </div>

      <div class="menu-chatbar">
        <img class="menu-chat-img" src="assets/menu_chat.png" alt="" />
      </div>
    </section>

    <!-- ── 3단계: 식당 상세 패널 ──────────────────────── -->
    <aside id="detailPanel" class="detail-panel">
      <button class="detail-close" id="detailClose">×</button>
      <div class="detail-body" id="detailBody"></div>
    </aside>
    <div id="overlay" class="overlay"></div>

    <!-- ── 순덕(신비할망) 캐릭터 + 말풍선 (지도 화면) ──── -->
    <div id="charStage" class="char-stage">
      <div class="speech-bubble" id="speechBubble">
        <img class="guide-window-img" src="assets/guide_window.png" alt="" onerror="this.style.display='none'" />
        <div class="guide-tag">
          <img src="assets/guide_button.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'guide-tag-fallback',textContent:'신비할망'}))" />
        </div>
        <p class="guide-text"><span id="speechText"></span></p>
      </div>
      <div class="char-wrap">
        <img class="char-img" id="charImg" src="assets/guide_character.png" alt="" onerror="this.style.display='none'" />
        <img class="char-food-img" id="mapFoodImg" src="" alt="" onload="this.style.display='block'" onerror="this.style.display='none'" />
      </div>
    </div>

  </div>
  <script src="app.js?v=10"></script>
</body>
</html>
