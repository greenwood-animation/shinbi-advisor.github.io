<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>신비할망의 바당 맛 지도</title>
  <link rel="stylesheet" href="style.css?v=31" />
</head>
<body>
  <div id="app">

    <!-- ── 1단계: 메뉴 그리드 ─────────────────────────── -->
    <section id="screen-menu" class="screen is-active">
      <div class="menu-bg" aria-hidden="true">
        <img src="assets/background_room.png" alt="" onerror="this.style.display='none'" />
        <img src="assets/순덕_메인.png" alt="" onerror="this.style.display='none'" />
        <img src="assets/menu_back.png" alt="" onerror="this.style.display='none'" />
      </div>
      <div class="menu-hero-spacer"></div>
      <header class="menu-head">
        <img class="menu-title-img" src="assets/menu_title.png" alt="제주 바당 맛 지도" onerror="this.style.display='none'" />
      </header>
      <div class="menu-panel">
        <div class="menu-grid" id="menuGrid"></div>
      </div>
    </section>

    <!-- ── 2단계: 제주 지도 + 핀 + 추천 맛집 ────────────── -->
    <section id="screen-map" class="screen">
      <img class="map-bg-full" src="assets/background_sea.png" alt="" onerror="this.style.display='none'" />
      <button class="back-btn" data-back="menu">
        <img src="assets/back_button.png" alt="← 메뉴로" onerror="this.style.display='none'" />
      </button>

      <!-- 순덕(신비할망) 캐릭터 + 말풍선: 지도 화면 콘텐츠와 함께 스크롤됨 -->
      <div id="charStage" class="char-stage">
        <div class="speech-bubble" id="speechBubble">
          <img class="guide-window-img" src="assets/guide_window.png" alt="신비할망" onerror="this.style.display='none'" />
          <p class="guide-text"><span id="speechText"></span></p>
        </div>
        <div class="char-wrap">
          <img class="char-img" id="charImg" src="assets/guide_character.png" alt="" onerror="this.style.display='none'" />
          <img class="char-food-img" id="mapFoodImg" src="" alt="" onload="this.style.display='block'" onerror="this.style.display='none'" />
        </div>
      </div>

      <!-- detail_window.png 안에 제목/부제목이 이미 그려져 있어 텍스트는 따로 안 넣음 -->
      <div class="map-card">
        <img class="card-frame-img" src="assets/detail_window.png" alt="제주 오름 맛집 지도 — 제주의 숨은 맛집을 찾아보세요!" onerror="this.style.display='none'" />
        <button class="more-btn map-more-btn" type="button">
          <img src="assets/map_more_btn.png" alt="지도 더보기 >" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'more-btn-fallback',textContent:'지도 더보기 >'}))" />
        </button>
      </div>

      <!-- 지도 프레임: 패널 위에 얹히는 투명 창(902×484, 화면 기준 88,747) — 그 안에서
           지도(701×531)를 100,-47 위치로 잡아 패널 안에 맞춰 보이도록 함 -->
      <div class="map-frame">
        <div class="map-wrap" id="mapWrap">
          <img class="map-bg" id="mapBg" src="assets/jeju-map-2.png" alt="제주 지도" />
          <div class="pins" id="pins"></div>
          <p class="map-empty" id="mapEmpty" hidden>아직 등록된 식당이 없어요 🐚</p>
        </div>
      </div>

      <!-- detail_window_2.png 안에 제목이 이미 그려져 있어 텍스트는 따로 안 넣음 -->
      <div class="recommend-card">
        <img class="card-frame-img" src="assets/detail_window_2.png" alt="신비할망 추천 맛집" onerror="this.style.display='none'" />
        <button class="more-btn reco-more-btn" type="button">
          <img src="assets/detail_button.png" alt="더보기 >" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'more-btn-fallback',textContent:'더보기 >'}))" />
        </button>
        <div class="recommend-card-inner">
          <div class="recommend-list" id="recommendList"></div>
        </div>
      </div>

    </section>

    <!-- ── 채팅 패널: 풀스크린으로 슬라이드 인, 두 화면 위에 공통으로 얹힘.
         panel_art.png(채팅방_미니패널) 원본 크기(993×1850)로 캔버스(1080×1920) 정중앙에 깔고,
         그 위에 실제 헤더 텍스트/메시지를 얹음(아바타는 이미 아트에 그려져 있어 따로 안 넣음).
         입력창은 따로 안 만들고 맨 밑 공용 chat-bar(menu_chat.png)를 그대로 씀 -->
    <div class="chat-backdrop" id="chatBackdrop"></div>
    <aside class="chat-panel" id="chatPanel" aria-hidden="true">
      <img class="chat-panel-art" src="assets/chat/panel_art.png" alt="" />
      <div class="chat-panel-content">
        <header class="chat-header">
          <div class="chat-header-text">
            <div class="chat-header-name">신비</div>
            <div class="chat-header-desc">제주를 안내해드려요!</div>
          </div>
          <button class="chat-close-btn" id="chatCloseBtn" type="button" aria-label="닫기">✕</button>
        </header>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-quick-replies" id="chatQuickReplies"></div>
      </div>
    </aside>

    <!-- 맨 밑 채팅바: 닫혀있을 땐 클릭해서 채팅 열기, 열려있을 땐 진짜 입력창+전송 버튼 역할.
         menu_chat.png(1080×200) 한 장 위에 투명 input + 아이콘(종이비행기) 클릭 영역을 얹음 -->
    <form class="chat-bar" id="chatBar">
      <img class="chat-bar-img" src="assets/menu_chat.png" alt="" />
      <button type="button" class="chat-bar-icon" id="chatBarIcon" aria-label="채팅 열기 / 전송"></button>
      <input type="text" id="chatBarInput" class="chat-bar-input" placeholder="순덕이에게 물어보기" autocomplete="off" />
    </form>

  </div>
  <script src="app.js?v=26"></script>
</body>
</html>
